# Семейства мутаций заголовков (ТЗ, п. 3.2). Мутации применяются ПОСЛЕ split.
# Видимость: M3, M5, M6 не попадают в train; M5, M6 не попадают и в val (hold-out семейства).
seeds: {train_base: 1000, val: 2000, test: 3000}   # train: base + seed запуска; val/test фиксированы для всех оптимизаторов
visibility:
  M1: [train, val, test]
  M2: [train, val, test]
  M3: [val, test]          # val видит только часть синонимов (val_syn), test - все
  M4: [train, val, test]
  M5: [test]
  M6: [test]
order: [M3, M2, M5, M1, M4]   # порядок применения к заголовку; M6 - на уровне документа после остальных
M1:
  char_probs: [0.03, 0.06, 0.10]
  ops: [replace, delete, swap]
M2:
  # (подстрока, замена), регистр не важен; одна подходящая замена на заголовок + остальные с p=0.5
  abbreviations:
    - [количество, кол-во]
    - [наименование, наим.]
    - [единица измерения, ед. изм.]
    - [стоимость, ст-ть]
    - [налогом, нал.]
    - [налога, нал.]
    - [налоговая, нал.]
    - [товаров, тов.]
    - [страна, стр.]
    - [происхождения, происх.]
    - [условное обозначение, усл. обозн.]
    - [национальное, нац.]
    - [сумма, сум.]
    - [цена, ц.]
    - [порядку, пор.]
    - [работ, раб.]
    - [услуг, усл.]
    - [описание, опис.]
    - [предъявляемая, предъявл.]
    - [покупателю, покуп.]
    - [тариф, тар.]
    - [акциза, акц.]
    - [единицу, ед.]
    - [номер, "№"]
    - [объем, об.]
    - [всего, вс.]
M4:
  p: 0.3
  ops: [upper, lower, punct, spaces, newline, trailing]
M5:
  p: 0.2
  modes: [glue, break]     # glue: «Стоимость / без НДС»; break: остаётся только нижний уровень шапки
M6:
  p_doc: 0.3
  extra_columns:
    - [Примечание, "б/н"]
    - ["Вес, кг", "0.5"]
    - [Серийный номер, "12/2026"]
    - [Склад, "-"]
    - [Номер партии, "2026-05-14"]
    - [Штрихкод, "4607001234567"]
# Синонимы по классам. val_syn видны в val и test; test_only - только в test.
synonyms:
  item_code:
    val_syn: [Артикул, Код ТРУ, Код позиции]
    test_only: [Код по КТРУ, ОКПД2, Код номенклатуры, Идентификатор товара]
  row_number:
    val_syn: [Номер строки, Порядковый номер]
    test_only: ["№ пп", "Поз.", Строка, "N п/п"]
  estimate_position:
    val_syn: [Позиция сметы, Пункт сметы]
    test_only: ["№ в смете", Шифр сметы, Код сметной позиции]
  item_name:
    val_syn: [Название товара, Товар]
    test_only: [Предмет закупки, Номенклатура, Продукция, Наименование работ/услуг]
  unit:
    val_syn: [Измерение, Единицы]
    test_only: [ЕИ, "Ед."]
  unit_code:
    val_syn: [Код ОКЕИ, Код по ОКЕИ]
    test_only: [Цифровой код ЕИ, ОКЕИ код]
  unit_name:
    val_syn: [Обозначение ед. изм., Краткое наименование ЕИ]
    test_only: [Усл. обозначение, Наименование единицы измерения]
  quantity:
    val_syn: [Объём, Число единиц]
    test_only: [Объем поставки, Колич., "Количество, шт."]
  price:
    val_syn: [Стоимость единицы, Единичная цена]
    test_only: [Цена за ед., "Цена единицы, руб.", Стоимость за единицу]
  amount_without_vat:
    val_syn: [Сумма без НДС, Стоимость без налога]
    test_only: [Итого без НДС, Сумма (нетто), Всего без налога]
  excise:
    val_syn: [Акциз, Сумма акциза]
    test_only: [Акцизный сбор, "Акциз, руб."]
  vat_rate:
    val_syn: [Ставка НДС, "НДС, %"]
    test_only: [Ставка налога, "% НДС", "Ставка, %"]
  vat_amount:
    val_syn: [Сумма НДС, Сумма налога]
    test_only: ["НДС, руб.", Размер НДС, НДС сумма]
  total_with_vat:
    val_syn: [Сумма с НДС, Итого с НДС]
    test_only: [Всего к оплате, Сумма (брутто), К оплате, Стоимость с налогом]
  country_of_origin:
    val_syn: [Страна производитель, Страна изготовления]
    test_only: [Происхождение, Страна, Страна происх.]
  unmapped:
    val_syn: [Комментарий, Склад]
    test_only: [Гарантия, Срок годности, Производитель, Вес]
