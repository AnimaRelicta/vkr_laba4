# Сценарии меняют только test (ТЗ, п. 4.2). Параметры заданы явно.
main_scenario: MAIN          # «test с мутациями» для метрик выбора (ПРЕДЛОЖЕНИЕ: средние параметры всех семейств)
scenarios:
  S0:   {desc: "Исходные заголовки (реальный тест)", mutations: {}}
  S1:   {desc: "Лёгкий шум", mutations: {M1: {p_char: 0.03}, M4: {p: 0.3}}}
  S2:   {desc: "Сильный шум", mutations: {M1: {p_char: 0.10}, M2: {p: 0.5}}}
  S3:   {desc: "Переименование: большая часть синонимов не видела train", mutations: {M2: {p: 0.5}, M3: {p: 0.7}}}
  S4:   {desc: "Смена шаблона (p = 0.5 на документ / заголовок)", mutations: {M5: {p: 0.5}, M6: {p_doc: 0.5}}}
  MAIN: {desc: "Все семейства, средние параметры", mutations: {M1: {p_char: 0.06}, M2: {p: 0.3}, M3: {p: 0.5}, M4: {p: 0.3}, M5: {p: 0.2}, M6: {p_doc: 0.3}}}
  S5:
    desc: "Марковское переключение версий шаблона по документам в порядке даты"
    markov:
      draws: 100
      start: T0
      stay: 0.8                  # остаёмся; иначе одна из двух других версий по 0.1
      versions:
        T0: {}                                  # исходная
        T1: {M2: {p: 1.0}}                      # сокращённая
        T2: {M3: {p: 1.0}}                      # синонимичная
train_mutations:                  # что видит train (параметры средние; seed перебрасывается на каждый запуск)
  M1: {p_char: 0.06}
  M2: {p: 0.3}
  M4: {p: 0.3}
val_mutations:
  M1: {p_char: 0.06}
  M2: {p: 0.3}
  M3: {p: 0.4}                    # только val_syn
  M4: {p: 0.3}
